apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-from-scratch

spec:
  project: default

  source:
    helm:
      releaseName: application-from-helm
      valueFiles:
      - test-values.yaml
    repoURL: https://github.com/kalpitmalviya/argo.git
    targetRevision: main
    path: argocd-applications-01/helm/nginx

  destination:
    server: https://kubernetes.default.svc
    namespace: default
